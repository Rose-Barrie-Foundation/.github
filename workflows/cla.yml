name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Rose-Barrie-Foundation/.github/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
          lock-pullrequest-aftermerge: true
          custom-notsigned-prcomment: 'Thanks for this. Before we can merge it, please read and sign our <a href="https://github.com/Rose-Barrie-Foundation/.github/blob/main/CLA.md">Contributor Licence Agreement</a>.<br><br><b>You keep the copyright in your work.</b> The agreement grants us a licence to publish it and to offer commercial licences so the research can be funded, and commits us to keep publishing your contribution openly — if we ever stop, that commercial right comes back to you.<br><br>To sign, post the sentence below as a comment on this pull request.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks — this is clear to review.'
